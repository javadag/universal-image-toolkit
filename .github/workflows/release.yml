name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: UniversalImageToolkit-Windows-x64.exe
            asset_path: dist/UniversalImageToolkit.exe
          - os: macos-latest
            artifact_name: UniversalImageToolkit-macOS-Universal.zip
            asset_path: UniversalImageToolkit-macOS-Universal.zip
          - os: ubuntu-latest
            artifact_name: UniversalImageToolkit-Linux-x64.tar.gz
            asset_path: UniversalImageToolkit-Linux-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          python build_executable.py

      - name: Package macOS Application (.zip)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          if [ -d "UniversalImageToolkit.app" ]; then
            zip -r ../UniversalImageToolkit-macOS-Universal.zip UniversalImageToolkit.app
          else
            zip -r ../UniversalImageToolkit-macOS-Universal.zip UniversalImageToolkit
          fi

      - name: Package Linux Binary (.tar.gz)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd dist
          tar -czvf ../UniversalImageToolkit-Linux-x64.tar.gz UniversalImageToolkit

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
